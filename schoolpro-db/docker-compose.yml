services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      PGDATA: /var/lib/postgresql/data/pgdata
      SKIP_SEED: ${SKIP_SEED:-false}
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./sql:/docker-entrypoint-initdb.d/sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schoolpro"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - schoolpro-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: schoolpro-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@schoolpro.edu.vn
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgadmin4/.pgpass:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - schoolpro-net

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  schoolpro-net:
    driver: bridge
