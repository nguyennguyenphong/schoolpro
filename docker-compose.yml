name: schoolpro

services:
  # ==============================================================================
  # 1. DATABASE: PostgreSQL 16
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: schoolpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      PGDATA: /var/lib/postgresql/data/pgdata
      SKIP_SEED: ${SKIP_SEED:-false}
    ports:
      - "5433:5432"
    volumes:
      - ./schoolpro-db/docker/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./schoolpro-db/sql:/docker-entrypoint-initdb.d/sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schoolpro"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - schoolpro-network

  # ==============================================================================
  # 2. DATABASE MANAGEMENT: pgAdmin 4
  # ==============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: schoolpro-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@schoolpro.edu.vn
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./schoolpro-db/docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./schoolpro-db/docker/pgadmin/pgpass:/pgadmin4/.pgpass:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - schoolpro-network

  # ==============================================================================
  # 3. CACHE & MESSAGE BROKER: Redis 7
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: schoolpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - schoolpro-network

  # ==============================================================================
  # 4. BACKEND API: Django REST Framework
  # ==============================================================================
  backend:
    build:
      context: ./schoolpro-backend
      dockerfile: Dockerfile
    container_name: schoolpro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_ENV: development
      DEBUG: "True"
      SECRET_KEY: "django-insecure-schoolpro-docker-secret-key-12345"
      DATABASE_URL: "postgres://postgres:password123@postgres:5432/schoolpro"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    networks:
      - schoolpro-network

  # ==============================================================================
  # 5. ASYNC WORKER: Celery
  # ==============================================================================
  celery_worker:
    build:
      context: ./schoolpro-backend
      dockerfile: Dockerfile
    container_name: schoolpro-celery-worker
    command: celery -A config worker -l info
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DJANGO_ENV: development
      DATABASE_URL: "postgres://postgres:password123@postgres:5432/schoolpro"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    networks:
      - schoolpro-network

  # ==============================================================================
  # 6. FRONTEND: React / Vite Nginx
  # ==============================================================================
  frontend:
    build:
      context: ./schoolpro-frontend
      dockerfile: Dockerfile
    container_name: schoolpro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - schoolpro-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  schoolpro-network:
    driver: bridge
