# Configuration for actions/labeler
frontend:
  - changed-files:
      - any-glob-to-any-file: 'schoolpro-frontend/**'

backend:
  - changed-files:
      - any-glob-to-any-file: 'schoolpro-backend/**'

database:
  - changed-files:
      - any-glob-to-any-file: 'schoolpro-db/**'

ci-cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'
          - '.vscode/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - '**/*.md'
