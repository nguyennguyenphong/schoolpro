name: Pull Request Standards & Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-lint:
    name: 📋 PR Title & Conventional Commits Validator
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Validate PR Title Format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allow Conventional Commits: feat, fix, chore, docs, style, refactor, perf, test, ci
          # Also allow issue tags like [#42] feat(...) or [#42] Title
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            ci
            build
            revert
          requireScope: false
          validateSingleCommit: false
        continue-on-error: true

  pr-labeler:
    name: 🏷️ Automatic Component Labeler
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Label PR based on changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
        continue-on-error: true
