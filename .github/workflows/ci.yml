name: SchoolPro CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. FRONTEND QUALITY & BUILD VERIFICATION
  # ============================================================================
  frontend-ci:
    name: 🎨 Frontend Validation & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./schoolpro-frontend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './schoolpro-frontend/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run Oxlint (Syntax & Fast Linter)
        run: npm run lint

      - name: 🛡️ Run TypeScript Type-Check (tsc -b)
        run: npx tsc -b

      - name: 🧪 Run Frontend Vitest Test Suite
        run: npx vitest run

      - name: 🚀 Test Production Build (Vite)
        run: npm run build

  # ============================================================================
  # 2. BACKEND QUALITY & INTEGRITY VERIFICATION
  # ============================================================================
  backend-ci:
    name: 🐍 Backend Validation & System Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./schoolpro-backend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: './schoolpro-backend/requirements/*.txt'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: 🔍 Run Ruff Linting
        run: ruff check apps/ config/ common/

      - name: 🎨 Run Ruff Formatting Check
        run: ruff format --check apps/ config/ common/

      - name: 🛡️ Run Django System Check
        run: DJANGO_ENV=development python manage.py check

      - name: 🗄️ Check for Missing Django Migrations
        run: DJANGO_ENV=development python manage.py makemigrations --check --dry-run

  # ============================================================================
  # 3. DATABASE SCHEMAS & TABLES VERIFICATION
  # ============================================================================
  database-ci:
    name: 🗄️ PostgreSQL Schemas & Tables Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schoolpro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: 🚀 Verify Database Schema Execution
        env:
          PGPASSWORD: password123
          POSTGRES_USER: postgres
          POSTGRES_DB: schoolpro
        run: |
          chmod +x ./schoolpro-db/docker/init-db.sh
          pg_isready -h localhost -p 5432 -U postgres -d schoolpro
          SQL_DIR="./schoolpro-db/sql"
          export SQL_DIR
          sed -i 's|/docker-entrypoint-initdb.d/sql|./schoolpro-db/sql|g' ./schoolpro-db/docker/init-db.sh
          psql -h localhost -p 5432 -U postgres -d schoolpro -f ./schoolpro-db/sql/00_schemas.sql
          echo "PostgreSQL schemas and tables verified successfully!"

  # ============================================================================
  # 4. DOCKER MULTI-STAGE BUILDS VERIFICATION
  # ============================================================================
  docker-ci:
    name: 🐳 Docker Multi-stage Builds Verification
    runs-on: ubuntu-latest
    # Run in parallel with tests to provide fast container build feedback without bottlenecking
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Backend Docker Image (Multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: ./schoolpro-backend
          file: ./schoolpro-backend/Dockerfile
          push: false
          tags: schoolpro-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔨 Build Frontend Docker Image (Multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: ./schoolpro-frontend
          file: ./schoolpro-frontend/Dockerfile
          push: false
          tags: schoolpro-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
