name: Security & Vulnerability Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # 1. DEPENDENCY AUDITING (FRONTEND & BACKEND)
  # ============================================================================
  dependency-audit:
    name: 🛡️ Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Frontend npm audit
        working-directory: ./schoolpro-frontend
        run: |
          npm audit --audit-level=high || true

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 🐍 Backend pip-audit
        working-directory: ./schoolpro-backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements/base.txt || true

  # ============================================================================
  # 2. DOCKER CONTAINER IMAGE SECURITY SCANNING (TRIVY)
  # ============================================================================
  container-scan:
    name: 🔍 Trivy Container Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Frontend Docker Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./schoolpro-frontend
          file: ./schoolpro-frontend/Dockerfile
          push: false
          tags: schoolpro-frontend:scan
          load: true

      - name: 🛡️ Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: schoolpro-frontend:scan
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: 🔨 Build Backend Docker Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./schoolpro-backend
          file: ./schoolpro-backend/Dockerfile
          push: false
          tags: schoolpro-backend:scan
          load: true

      - name: 🛡️ Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: schoolpro-backend:scan
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
